version: '3.8'

services:
  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anarva-backend
    ports:
      - "3000:10000"
    environment:
      - ENVIRONMENT=development
      - PORT=10000
      - SECRET_KEY=dev-secret-key-change-in-production
      - SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-placeholder}
      - DOCTOR_USERNAME=doctor
      - DOCTOR_PASSWORD=doctor123
      - GEMINI_MODEL=gemini-2.5-flash
      - AI_TIMEOUT_SECONDS=60
    networks:
      - anarva-network

  # Frontend Service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
        VITE_SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-placeholder}
    container_name: anarva-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - anarva-network

networks:
  anarva-network:
    driver: bridge
